<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn banner artboard — Anas Elbtioui</title>
  <!-- One-off render target: 3168×792 (2× of 1584×396). Not part of site IA. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #10191c;
      --fg: #c3d2d0;
      --fg-bright: #eaf2f0;
      --muted: #748986;
      --accent: #3d7a7e;
      --accent-mist: #5a9a9c;
      --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
      --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    /* Fixed 2× LinkedIn personal cover */
    .board {
      position: relative;
      width: 3168px;
      height: 792px;
      overflow: hidden;
      color-scheme: dark;
      background-color: var(--bg);
      background-image:
        radial-gradient(
          ellipse 130% 100% at 112% -12%,
          rgba(45, 110, 118, 0.16) 0%,
          rgba(28, 72, 78, 0.09) 28%,
          rgba(18, 42, 46, 0.04) 52%,
          var(--bg) 100%
        ),
        radial-gradient(
          ellipse 120% 95% at -8% 118%,
          rgba(6, 10, 12, 0.42) 0%,
          rgba(10, 16, 18, 0.2) 32%,
          rgba(12, 20, 22, 0.07) 58%,
          var(--bg) 100%
        );
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      opacity: 0.72;
      mix-blend-mode: overlay;
      background-image: url("./grain.png");
      background-repeat: repeat;
      background-size: 220px 220px;
      background-position: 0 0;
    }

    /* Leaves — top-right, hang off edge (standby .leaf-wash, scaled for ultrawide) */
    .leaf-wash {
      position: absolute;
      z-index: 0;
      top: -18%;
      right: -10%;
      width: 2100px;
      aspect-ratio: 3 / 2;
      pointer-events: none;
      background-image: url("./media/fig-leaf-illustration.webp");
      background-repeat: no-repeat;
      background-position: top left;
      background-size: contain;
      opacity: 0.36;
      filter: saturate(0.62) brightness(0.78) contrast(1.02);
      -webkit-mask-image: radial-gradient(
        ellipse 70% 70% at 22% 22%,
        #000 12%,
        transparent 68%
      );
      mask-image: radial-gradient(
        ellipse 70% 70% at 22% 22%,
        #000 12%,
        transparent 68%
      );
    }

    /* Fig — far right only (bottom-left is LinkedIn photo). Faint, behind leaves. */
    .fig-wash {
      position: absolute;
      z-index: 0;
      right: -2%;
      bottom: -18%;
      width: 720px;
      aspect-ratio: 1;
      pointer-events: none;
      background-image: url("./media/fig-illustration.webp");
      background-repeat: no-repeat;
      background-position: 48% 55%;
      background-size: contain;
      transform: scaleX(-1);
      opacity: 0.22;
      filter: saturate(0.55) brightness(0.72) contrast(1.02);
      -webkit-mask-image: radial-gradient(
        ellipse 78% 78% at 58% 58%,
        #000 28%,
        transparent 78%
      );
      mask-image: radial-gradient(
        ellipse 78% 78% at 58% 58%,
        #000 28%,
        transparent 78%
      );
    }

    /*
      Safe zone at 2×:
      - left inset ~440px (photo disc ~200×200 @1×)
      - avoid outer ~240px sides (mobile crop)
      - type box ~1120×240 @1× → 2240×480 @2× max, optically center-left
    */
    .copy {
      position: absolute;
      z-index: 10;
      left: 480px;
      top: 50%;
      transform: translateY(-50%);
      max-width: 1680px;
      padding: 0;
    }

    .title {
      margin: 0 0 28px;
      font-family: var(--font-display);
      font-size: 92px;
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1.08;
      color: var(--fg-bright);
      text-wrap: balance;
    }

    .role {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.35;
      color: var(--accent-mist);
    }

    /* Preview-only: LinkedIn photo disc (hidden for export via ?export=1) */
    .photo-safe {
      display: none;
      position: absolute;
      z-index: 50;
      left: 48px;
      bottom: -80px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      border: 6px solid #fff;
      background: rgba(234, 242, 240, 0.12);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    body.show-safe .photo-safe {
      display: block;
    }
  </style>
</head>
<body>
  <div class="board" id="board" role="img" aria-label="LinkedIn cover: I build tools people can actually use. Full-stack developer and product designer.">
    <div class="leaf-wash" aria-hidden="true"></div>
    <div class="fig-wash" aria-hidden="true"></div>
    <div class="copy">
      <p class="title">I build tools people can actually use.</p>
      <p class="role">Full-stack developer and product designer</p>
    </div>
    <div class="grain" aria-hidden="true"></div>
    <div class="photo-safe" aria-hidden="true" title="LinkedIn profile photo overlay"></div>
  </div>
  <script>
    // ?safe=1 shows the photo disc for crop checks
    if (new URLSearchParams(location.search).has("safe")) {
      document.body.classList.add("show-safe");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn banner artboard — Anas Elbtioui</title>
  <!-- One-off render target: 3168×792 (2×). Export THIS size to LinkedIn — do not downscale to 1584. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=block" rel="stylesheet">
  <style>
    :root {
      --bg: #10191c;
      --fg: #c3d2d0;
      --fg-bright: #eaf2f0;
      --muted: #748986;
      --accent-mist: #5a9a9c;
      --fox: #d06e3e;
      --font-hand: "Reenie Beanie", "Segoe Script", cursive;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    body {
      opacity: 0;
    }

    body.is-ready {
      opacity: 1;
    }

    /* Fixed 2× LinkedIn personal cover — matches standby field */
    .board {
      position: relative;
      width: 3168px;
      height: 792px;
      overflow: hidden;
      color-scheme: dark;
      background-color: var(--bg);
      background-image:
        radial-gradient(
          ellipse 78% 56% at 50% 16%,
          color-mix(in srgb, var(--fox) 24%, transparent) 0%,
          transparent 62%
        ),
        radial-gradient(
          ellipse 130% 100% at 112% -12%,
          rgba(45, 110, 118, 0.16) 0%,
          rgba(28, 72, 78, 0.09) 28%,
          rgba(18, 42, 46, 0.04) 52%,
          var(--bg) 100%
        ),
        radial-gradient(
          ellipse 120% 95% at -8% 118%,
          rgba(6, 10, 12, 0.42) 0%,
          rgba(10, 16, 18, 0.2) 32%,
          rgba(12, 20, 22, 0.07) 58%,
          var(--bg) 100%
        );
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      opacity: 0.55;
      mix-blend-mode: overlay;
      background-image: url("../grain.png");
      background-repeat: repeat;
      background-size: 220px 220px;
      background-position: 0 0;
    }

    /* Leaves — far right ground (site puts them bottom-left; photo owns that corner here) */
    .leaf-wash {
      position: absolute;
      z-index: 0;
      right: -8%;
      bottom: -28%;
      width: 1680px;
      aspect-ratio: 3 / 2;
      pointer-events: none;
      background-image: url("../media/fig-leaf-illustration.webp");
      background-repeat: no-repeat;
      background-position: top left;
      background-size: contain;
      transform: rotate(180deg);
      opacity: 0.28;
      filter: saturate(0.62) brightness(0.78) contrast(1.02);
      -webkit-mask-image: radial-gradient(
        ellipse 70% 70% at 78% 22%,
        #000 14%,
        transparent 70%
      );
      mask-image: radial-gradient(
        ellipse 70% 70% at 78% 22%,
        #000 14%,
        transparent 70%
      );
    }

    /* Fox desk — right hero plate (homepage signature still) */
    .fox-wash {
      position: absolute;
      z-index: 1;
      right: 40px;
      bottom: -40px;
      width: 980px;
      height: 740px;
      pointer-events: none;
      background-image: url("../media/fox-desk.webp");
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: contain;
      /* No saturate/brightness crush — LinkedIn compresses enough already */
      -webkit-mask-image: linear-gradient(
        90deg,
        transparent 0%,
        #000 18%,
        #000 100%
      );
      mask-image: linear-gradient(
        90deg,
        transparent 0%,
        #000 18%,
        #000 100%
      );
    }

    /*
      Safe zone at 2×:
      - left clear of avatar (~360px @1×)
      - sit high — bottom third gets photo bleed
      - leave right for fox plate
    */
    .copy {
      position: absolute;
      z-index: 10;
      left: 640px;
      top: 120px;
      max-width: 1580px;
      padding: 0;
    }

    .title {
      margin: 0 0 20px;
      font-family: var(--font-hand);
      font-size: 108px;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 0.98;
      color: var(--fg-bright);
      text-wrap: balance;
      /* Thin script survives LinkedIn JPEG better with slight optical weight */
      -webkit-text-stroke: 0.4px color-mix(in srgb, var(--fg-bright) 55%, transparent);
      text-shadow: 0 0 0.6px var(--fg-bright);
    }

    .role {
      margin: 0;
      font-family: var(--font-hand);
      font-size: 60px;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.2;
      color: var(--fox);
      -webkit-text-stroke: 0.35px color-mix(in srgb, var(--fox) 50%, transparent);
      text-shadow: 0 0 0.5px var(--fox);
    }

    .photo-safe {
      display: none;
      position: absolute;
      z-index: 50;
      left: 48px;
      bottom: -100px;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      border: 6px solid #fff;
      background: rgba(234, 242, 240, 0.12);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    body.show-safe .photo-safe {
      display: block;
    }
  </style>
</head>
<body>
  <div class="board" id="board" role="img" aria-label="LinkedIn cover: I sit with how a product feels to a person, then build it. Software developer and product designer.">
    <div class="leaf-wash" aria-hidden="true"></div>
    <div class="fox-wash" aria-hidden="true"></div>
    <div class="copy">
      <p class="title">I sit with how a product feels to a person, then build it.</p>
      <p class="role">software developer and product designer</p>
    </div>
    <div class="grain" aria-hidden="true"></div>
    <div class="photo-safe" aria-hidden="true" title="LinkedIn profile photo overlay"></div>
  </div>
  <script>
    if (new URLSearchParams(location.search).has("safe")) {
      document.body.classList.add("show-safe");
    }
    // Gate paint until Reenie Beanie is ready (avoids soft fallback glyphs in screenshot)
    document.fonts.ready.then(() => {
      document.body.classList.add("is-ready");
      document.documentElement.dataset.bannerReady = "1";
    });
  </script>
</body>
</html>

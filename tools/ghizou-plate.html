<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghizou — archive plate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --wine: #6f1c37;
      --wine-mid: #481325;
      --wine-deep: #22161d;
      --cream: #faebde;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--wine-deep);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .plate {
      position: relative;
      width: 800px;
      height: 1000px;
      isolation: isolate;
      overflow: hidden;
      color: var(--cream);
      background: linear-gradient(165deg, var(--wine) 0%, var(--wine-mid) 48%, var(--wine-deep) 100%);
    }

    .ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(58px);
      opacity: 0.42;
      animation: orb-drift 6.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
    }

    .orb-one {
      width: 360px;
      height: 360px;
      top: -70px;
      right: 6%;
      background: rgba(255, 168, 196, 0.16);
    }

    .orb-two {
      width: 460px;
      height: 460px;
      left: -120px;
      bottom: -140px;
      background: rgba(122, 31, 61, 0.3);
      animation-name: orb-drift-reverse;
      animation-duration: 7.6s;
    }

    .orb-three {
      width: 300px;
      height: 300px;
      right: -80px;
      top: 26%;
      background: rgba(255, 255, 255, 0.08);
      animation-duration: 8.4s;
    }

    .stack {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 64px 80px;
      gap: 28px;
      text-align: center;
    }

    .mascot {
      width: min(62%, 420px);
      height: auto;
      display: block;
    }

    .title {
      margin: 0;
      max-width: 11ch;
      font-family: Fraunces, serif;
      font-weight: 600;
      font-size: 56px;
      line-height: 0.98;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .body {
      margin: 0;
      max-width: 22ch;
      font-family: Manrope, sans-serif;
      font-size: 22px;
      line-height: 1.45;
      color: rgba(250, 235, 222, 0.82);
      text-wrap: pretty;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      opacity: 0.12;
      background-image: url("../grain.png");
      background-size: 180px 180px;
      mix-blend-mode: overlay;
    }

    @keyframes orb-drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(4%, -5%, 0) scale(1.06); }
    }

    @keyframes orb-drift-reverse {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(-5%, 4%, 0) scale(1.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb { animation: none; }
    }
  </style>
</head>
<body>
  <div class="plate" id="plate">
    <div class="ambient" aria-hidden="true">
      <div class="orb orb-one"></div>
      <div class="orb orb-two"></div>
      <div class="orb orb-three"></div>
    </div>
    <div class="stack">
      <img
        class="mascot"
        src="../media/work/marks/ghizou-mascot.svg"
        alt="Ghizou"
        width="858"
        height="1080"
      >
      <h1 class="title">Compta plus calme, plus nette.</h1>
      <p class="body">Tools that help close an accounting month.</p>
    </div>
    <div class="grain" aria-hidden="true"></div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profit Flow Academy — archive plate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0a09;
      --fg: #fafaf9;
      --muted: #a8a29e;
      --accent: #f25a32;
      --accent-deep: #c74a23;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body { display: grid; place-items: center; }

    .plate {
      position: relative;
      width: 800px;
      height: 1000px;
      isolation: isolate;
      overflow: hidden;
      color: var(--fg);
      background:
        radial-gradient(ellipse 72% 44% at 20% -8%, rgba(242, 90, 50, 0.22) 0%, transparent 58%),
        radial-gradient(ellipse 48% 36% at 100% 10%, rgba(199, 74, 35, 0.18) 0%, transparent 52%),
        var(--bg);
    }

    .ember {
      position: absolute;
      width: 300px;
      height: 300px;
      left: 50%;
      top: 36%;
      transform: translate(-50%, -50%);
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(242, 90, 50, 0.32) 0%, transparent 68%);
      filter: blur(30px);
      pointer-events: none;
      z-index: 0;
      animation: ember-breathe 2.5s ease-in-out infinite;
    }

    .stack {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 56px 88px;
      gap: 26px;
      text-align: center;
    }

    .mark {
      width: min(58%, 380px);
      height: auto;
      display: block;
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.5));
    }

    .title {
      margin: 0;
      max-width: 11ch;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      font-size: 52px;
      letter-spacing: -0.04em;
      line-height: 0.98;
      text-wrap: balance;
    }

    .body {
      margin: 0;
      max-width: 18ch;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 22px;
      line-height: 1.4;
      color: var(--muted);
      text-wrap: pretty;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      opacity: 0.1;
      background-image: url("../grain.png");
      background-size: 180px 180px;
      mix-blend-mode: overlay;
    }

    @keyframes ember-breathe {
      0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ember { animation: none; }
    }
  </style>
</head>
<body>
  <div class="plate" id="plate">
    <div class="ember" aria-hidden="true"></div>
    <div class="stack">
      <img
        class="mark"
        src="../media/work/marks/profit-flow-mark.svg"
        alt="Profit Flow Academy"
        width="742"
        height="451"
      >
      <h1 class="title">Profit Flow Academy</h1>
      <p class="body">Trading mentorship to get funded.</p>
    </div>
    <div class="grain" aria-hidden="true"></div>
  </div>
</body>
</html>

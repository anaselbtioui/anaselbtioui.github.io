<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flint — archive plate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1114;
      --fg: #e9e6df;
      --muted: #9a978f;
      --accent: #f5a623;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body { display: grid; place-items: center; }

    .plate {
      position: relative;
      width: 800px;
      height: 1000px;
      isolation: isolate;
      overflow: hidden;
      color: var(--fg);
      background:
        radial-gradient(ellipse 70% 42% at 18% -6%, rgba(245, 166, 35, 0.16) 0%, transparent 58%),
        radial-gradient(ellipse 50% 35% at 100% 8%, rgba(46, 52, 59, 0.7) 0%, transparent 52%),
        var(--bg);
    }

    .ember {
      position: absolute;
      width: 280px;
      height: 280px;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(245, 166, 35, 0.28) 0%, transparent 68%);
      filter: blur(28px);
      pointer-events: none;
      z-index: 0;
      animation: ember-breathe 2.5s ease-in-out infinite;
    }

    .stack {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 64px 88px;
      gap: 28px;
      text-align: center;
    }

    .mark {
      width: min(46%, 320px);
      height: auto;
      display: block;
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.45));
    }

    .title {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      font-size: 64px;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }

    .body {
      margin: 0;
      max-width: 18ch;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 22px;
      line-height: 1.4;
      color: var(--muted);
      text-wrap: pretty;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      opacity: 0.1;
      background-image: url("../grain.png");
      background-size: 180px 180px;
      mix-blend-mode: overlay;
    }

    @keyframes ember-breathe {
      0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ember { animation: none; }
    }
  </style>
</head>
<body>
  <div class="plate" id="plate">
    <div class="ember" aria-hidden="true"></div>
    <div class="stack">
      <img
        class="mark"
        src="../media/work/marks/flint-mark.svg"
        alt="Flint"
        width="711"
        height="982"
      >
      <h1 class="title">Flint</h1>
      <p class="body">Public company contact lookup.</p>
    </div>
    <div class="grain" aria-hidden="true"></div>
  </div>
</body>
</html>

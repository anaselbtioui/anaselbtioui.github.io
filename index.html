<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anas Elbtioui — tools people can use</title>
  <meta name="description" content="Anas Elbtioui builds SaaS apps, ecommerce sites, CRMs, and scrapers for small businesses — clear to run, steady as they grow. Site still in progress.">
  <meta name="theme-color" content="#1a1e23">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./standby.css?v=26">
  <script type="module" src="./standby.js?v=26"></script>
</head>
<body class="standby">
  <a class="skip" href="#main">Skip to content</a>

  <main id="main" class="stage">
    <header class="hero">
      <a class="logo reveal" style="--d:0" href="#main" aria-label="Anas Elbtioui">
        <span class="logo-mark" aria-hidden="true">
          <span class="logo-mark-surface"></span>
          <span class="logo-mark-lit"></span>
          <span class="logo-mark-spec"></span>
        </span>
        <span class="logo-word">Anas Elbtioui</span>
      </a>
      <h1 class="title reveal" style="--d:1">I build tools people can actually use.</h1>
      <p class="lede reveal" style="--d:2">
        SaaS apps, ecommerce sites, CRMs, and scrapers for small businesses —
        clear on day one, steady as volume grows, built to earn their keep.
      </p>
      <p class="cli reveal" style="--d:3" data-one-line aria-live="polite">
        <span data-ol-spin aria-hidden="true">⠋</span>
        <span data-ol-word>Building</span>
      </p>
      <nav class="cta reveal" style="--d:4" aria-label="Links">
        <a class="hit" href="#contact">Contact</a>
        <a class="hit" href="https://github.com/anaselbtioui" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a class="hit" href="https://www.linkedin.com/in/anas-elbtioui" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </header>

    <section class="contact reveal" style="--d:5" id="contact" aria-label="Contact">
      <form
        class="inquiry"
        id="inquiry"
        action="https://formspree.io/f/xpqvblgj"
        method="POST"
        novalidate
      >
        <input type="hidden" name="_subject" value="anaselbt.me inquiry">
        <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required autocomplete="name" maxlength="120">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" maxlength="200">
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required rows="5" maxlength="4000" placeholder="What are you working on?"></textarea>
        </div>

        <div class="form-row">
          <button class="submit hit" type="submit" data-submit>Send</button>
          <p class="form-news" data-form-news role="status" aria-live="polite"></p>
        </div>
      </form>

      <p class="contact-alt">
        <a class="mono" href="mailto:anaselbtioui@gmail.com">anaselbtioui@gmail.com</a>
      </p>
    </section>
  </main>
</body>
</html>
